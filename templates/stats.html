<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История запросов</title>
    <style>
        body { font-family: Arial; padding: 30px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { padding: 8px; border: 1px solid #ccc; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

<h2>История</h2>

<table>
  <tr>
    <th>Файл</th>
    <th>Собак без намордника</th>
    <th>Время</th>
  </tr>

  {% for item in history %}
  <tr>
    <td>{{ item.file }}</td>
    <td>{{ item.dogs }}</td>
    <td>{{ item.time }}</td>
  </tr>
  {% endfor %}
</table>
<br><br>
<a href="/export/excel">⬇ Скачать Excel</a>

<br>
<a href="/">⬅ Назад</a>

</body>
</html>
